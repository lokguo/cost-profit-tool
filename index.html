<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>利潤計算器｜圖形美化版</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#08111f;
      --bg2:#0d1730;
      --panel:rgba(9,19,36,.9);
      --panel2:rgba(12,24,45,.92);
      --line:rgba(90,160,255,.15);
      --line2:rgba(90,160,255,.35);
      --text:#ecf6ff;
      --muted:#8ca8c9;
      --cyan:#4dd8ff;
      --blue:#5a7cff;
      --purple:#8b5cf6;
      --green:#31d39a;
      --red:#ff6a7e;
      --soft:#13223e;
      --shadow:0 22px 60px rgba(0,0,0,.35);
    }

    html,body{min-height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(77,216,255,.12), transparent 26%),
        radial-gradient(circle at 90% 15%, rgba(139,92,246,.12), transparent 25%),
        radial-gradient(circle at 85% 90%, rgba(90,124,255,.12), transparent 28%),
        linear-gradient(180deg, #060d19 0%, #08111f 50%, #091526 100%);
      padding:16px;
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(77,216,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,216,255,.04) 1px, transparent 1px);
      background-size:30px 30px;
      pointer-events:none;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,.15));
    }

    .app{width:100%;max-width:980px;margin:0 auto;position:relative;z-index:1}
    .card{
      background:linear-gradient(180deg, rgba(9,18,34,.93), rgba(7,15,28,.94));
      border:1px solid rgba(98,170,255,.16);
      border-radius:28px;
      overflow:hidden;
      box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.02) inset;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .header{
      padding:24px 24px 18px;
      border-bottom:1px solid rgba(98,170,255,.1);
      background:
        radial-gradient(circle at 15% 10%, rgba(77,216,255,.12), transparent 30%),
        linear-gradient(135deg, rgba(12,26,50,.95), rgba(9,17,31,.95));
      position:relative;
    }

    .header::after{
      content:"";
      position:absolute;left:24px;right:24px;bottom:0;height:1px;
      background:linear-gradient(90deg, transparent, rgba(77,216,255,.75), transparent);
      box-shadow:0 0 10px rgba(77,216,255,.35);
    }

    .topline{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;
    }

    .chip{
      display:inline-flex;align-items:center;gap:8px;padding:7px 12px;
      border:1px solid rgba(77,216,255,.18);
      border-radius:999px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
      color:#bfe5ff;background:rgba(9,20,39,.58)
    }

    .dot{
      width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);
    }

    .brand{display:flex;align-items:center;gap:14px}
    .logo{
      width:56px;height:56px;border-radius:17px;display:grid;place-items:center;
      font-size:24px;font-weight:900;color:white;
      background:linear-gradient(135deg, rgba(77,216,255,.28), rgba(90,124,255,.22));
      border:1px solid rgba(77,216,255,.26);
      box-shadow:0 0 20px rgba(77,216,255,.14), inset 0 0 18px rgba(77,216,255,.08);
    }

    h1{margin:0 0 4px;font-size:28px;letter-spacing:.02em}
    .sub{margin:0;color:var(--muted);font-size:13px;line-height:1.55}

    .body{padding:22px}
    .tabs{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;
      background:rgba(7,15,28,.68);padding:7px;border-radius:18px;
      border:1px solid rgba(77,216,255,.1);margin-bottom:20px
    }

    .tab{
      height:44px;border-radius:13px;border:1px solid transparent;background:transparent;
      color:#9ab7d9;font-size:14px;font-weight:800;cursor:pointer;transition:.18s ease;
    }
    .tab.active{
      color:#f3fbff;
      background:linear-gradient(135deg, rgba(77,216,255,.14), rgba(90,124,255,.16));
      border-color:rgba(77,216,255,.25);
      box-shadow:0 0 18px rgba(77,216,255,.06), inset 0 0 15px rgba(77,216,255,.04);
    }

    .panel{display:none}
    .panel.active{display:block}

    .form-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}
    .form-grid-2{grid-template-columns:1fr 1fr}
    .field{margin-bottom:0}
    .label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    label{font-size:14px;font-weight:800;color:#e2f1ff}
    .hint{font-size:11px;color:#83a4c7;letter-spacing:.04em;text-transform:uppercase}

    .inputbox{position:relative}
    .inputbox::before{
      content:"";position:absolute;inset:0;border-radius:16px;padding:1px;
      background:linear-gradient(135deg, rgba(77,216,255,.18), rgba(90,124,255,.09));
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
    }

    input{
      width:100%;height:58px;border-radius:16px;border:1px solid rgba(77,216,255,.08);
      background:rgba(4,13,24,.92);color:var(--text);outline:none;
      padding:0 44px;font-size:20px;font-weight:850;appearance:none;-webkit-appearance:none;
    }
    input::placeholder{color:#5c7898}
    input:focus{
      border-color:rgba(77,216,255,.35);
      box-shadow:0 0 0 4px rgba(77,216,255,.08), inset 0 0 18px rgba(77,216,255,.04)
    }
    .prefix,.suffix{
      position:absolute;top:50%;transform:translateY(-50%);
      color:#8aabd0;font-weight:900;font-size:16px;pointer-events:none
    }
    .prefix{left:16px}.suffix{right:16px}

    .btn{
      height:54px;border-radius:16px;border:1px solid rgba(77,216,255,.3);
      padding:0 22px;background:linear-gradient(135deg, rgba(77,216,255,.24), rgba(90,124,255,.2));
      color:white;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap;
      box-shadow:0 0 18px rgba(77,216,255,.07), inset 0 0 18px rgba(77,216,255,.05);
    }
    .btn:active{transform:scale(.99)}

    .dashboard{
      display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:20px
    }

    .block{
      background:linear-gradient(180deg, rgba(11,22,42,.96), rgba(7,16,30,.98));
      border:1px solid rgba(77,216,255,.1);
      border-radius:22px;padding:18px;position:relative;overflow:hidden;
      box-shadow:inset 0 0 18px rgba(77,216,255,.025);
    }
    .block::after{
      content:"";position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg, transparent, rgba(77,216,255,.65), transparent);opacity:.55
    }

    .main-profit{
      background:
        radial-gradient(circle at 85% 15%, rgba(77,216,255,.10), transparent 26%),
        linear-gradient(160deg, rgba(11,22,42,.98), rgba(7,16,30,.99));
    }

    .title{
      font-size:12px;color:#86a8ca;letter-spacing:.05em;margin-bottom:8px
    }
    .big-number{
      font-size:40px;font-weight:950;letter-spacing:-.04em;word-break:break-word
    }
    .status{margin-top:8px;font-size:13px;line-height:1.5}
    .good{color:var(--green)} .bad{color:var(--red)} .neutral{color:#a8c5e2}

    .meter{
      margin-top:14px;height:10px;border-radius:999px;
      background:rgba(77,216,255,.08);overflow:hidden;border:1px solid rgba(77,216,255,.1)
    }
    .meter-bar{
      height:100%;width:0%;border-radius:999px;
      background:linear-gradient(90deg, var(--cyan), var(--blue));box-shadow:0 0 14px rgba(77,216,255,.35);
      transition:width .25s ease
    }

    .mini-cards{
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px
    }
    .mini{
      background:rgba(13,25,46,.78);
      border:1px solid rgba(77,216,255,.09);border-radius:16px;padding:14px
    }
    .mini .m-title{font-size:11px;color:#7d9ec1;margin-bottom:6px}
    .mini .m-value{font-size:20px;font-weight:900;word-break:break-word}

    .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
    .chart-card{
      background:linear-gradient(180deg, rgba(10,21,39,.95), rgba(7,15,28,.98));
      border:1px solid rgba(77,216,255,.1);border-radius:22px;padding:18px;
    }

    .chart-title{
      font-size:13px;font-weight:800;color:#e7f4ff;margin-bottom:12px
    }

    .donut-wrap{
      display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap
    }
    .donut-box{position:relative;width:200px;height:200px}
    .donut-box svg{width:100%;height:100%;transform:rotate(-90deg)}
    .donut-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:16}
    .donut-cost{fill:none;stroke:var(--blue);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .25s ease}
    .donut-profit{fill:none;stroke:var(--cyan);stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .25s ease}
    .donut-center{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
      text-align:center;padding:20px
    }
    .donut-center .small{font-size:12px;color:#86a8ca}
    .donut-center .value{font-size:26px;font-weight:950}
    .legend{display:grid;gap:12px;min-width:150px}
    .legend-item{display:flex;align-items:center;gap:10px}
    .swatch{width:12px;height:12px;border-radius:4px}
    .legend-text{display:flex;flex-direction:column;gap:3px}
    .legend-name{font-size:12px;color:#8ca8c9}
    .legend-value{font-size:18px;font-weight:900}

    .bars{display:grid;gap:14px;margin-top:8px}
    .bar-item{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center}
    .bar-label{font-size:12px;color:#94b2d2}
    .bar-track{
      height:12px;border-radius:999px;background:rgba(77,216,255,.08);
      overflow:hidden;border:1px solid rgba(77,216,255,.08)
    }
    .bar-fill{
      height:100%;width:0%;border-radius:999px;transition:width .25s ease
    }
    .fill-price{background:linear-gradient(90deg, #66e0ff, #5a7cff)}
    .fill-cost{background:linear-gradient(90deg, #8b5cf6, #5a7cff)}
    .fill-profit{background:linear-gradient(90deg, #2dd4bf, #31d39a)}
    .fill-loss{background:linear-gradient(90deg, #ff7b8d, #ff6a7e)}
    .bar-value{font-size:13px;font-weight:800;color:#e5f2ff;min-width:70px;text-align:right}

    .reverse-box{
      margin-top:20px;
      background:
        radial-gradient(circle at 88% 15%, rgba(139,92,246,.14), transparent 28%),
        linear-gradient(160deg, rgba(11,22,42,.98), rgba(7,16,30,.99));
      border:1px solid rgba(139,92,246,.18);border-radius:22px;padding:18px
    }
    .reverse-price{font-size:38px;font-weight:950;letter-spacing:-.04em}
    .reverse-detail{margin-top:8px;font-size:13px;color:#b3bfd4;line-height:1.55}
    .reverse-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .metric{
      background:rgba(15,26,48,.72);border:1px solid rgba(139,92,246,.12);border-radius:16px;padding:14px
    }
    .metric .label{font-size:11px;color:#9ca4da;margin-bottom:6px}
    .metric .value{font-size:22px;font-weight:900}

    .footer-actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
    .clear{
      height:46px;border-radius:14px;border:1px solid rgba(77,216,255,.1);
      background:rgba(8,18,33,.85);color:#b9d4ef;font-size:14px;font-weight:800;cursor:pointer
    }

    .note{
      margin-top:18px;padding:15px 16px;border-radius:18px;
      background:rgba(8,18,33,.84);border:1px solid rgba(77,216,255,.08);
      color:#8ba8c9;font-size:12px;line-height:1.7;position:relative
    }
    .note::before{
      content:"DATA FORMULA";
      position:absolute;top:-10px;left:12px;padding:0 8px;
      background:#08111f;color:#79b4e4;font-size:10px;letter-spacing:.14em
    }

    @media(max-width:860px){
      .dashboard{grid-template-columns:1fr}
    }
    @media(max-width:680px){
      .form-grid{grid-template-columns:1fr}
      .chart-grid{grid-template-columns:1fr}
      .mini-cards{grid-template-columns:1fr}
      .reverse-metrics{grid-template-columns:1fr}
      .topline{flex-direction:column;align-items:flex-start}
    }
    @media(max-width:460px){
      body{padding:10px}
      .header{padding:20px 18px 16px}
      .body{padding:16px}
      h1{font-size:24px}
      .big-number,.reverse-price{font-size:31px}
      .donut-box{width:170px;height:170px}
      .bar-item{grid-template-columns:64px 1fr auto}
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card">
      <header class="header">
        <div class="brand">
          <div class="logo">%</div>
          <div>
            <h1>利潤計算器</h1>
          </div>
        </div>
      </header>

      <main class="body">
        <div class="tabs">
          <button class="tab active" type="button" data-panel="normal">售價 → 利潤分析</button>
          <button class="tab" type="button" data-panel="reverse">目標利潤率 → 反推售價</button>
        </div>

        <section id="normal" class="panel active">
          <div class="form-grid form-grid-2">
            <div class="field">
              <div class="label-row">
                <label for="price">售價</label>
                <div class="hint">selling price</div>
              </div>
              <div class="inputbox">
                <span class="prefix">$</span>
                <input id="price" type="number" inputmode="decimal" step="any" placeholder="例如 1000">
              </div>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="cost">成本</label>
                <div class="hint">cost</div>
              </div>
              <div class="inputbox">
                <span class="prefix">$</span>
                <input id="cost" type="number" inputmode="decimal" step="any" placeholder="例如 700">
              </div>
            </div>
          </div>

          <div class="dashboard">
            <div class="block main-profit">
              <div class="title">售價扣除成本後</div>
              <div id="profit" class="big-number">$0</div>
              <div id="status" class="status neutral">請輸入售價與成本</div>
              <div class="meter"><div id="meterBar" class="meter-bar"></div></div>

              <div class="mini-cards">
                <div class="mini">
                  <div class="m-title">售價</div>
                  <div id="miniPrice" class="m-value">$0</div>
                </div>
                <div class="mini">
                  <div class="m-title">成本</div>
                  <div id="miniCost" class="m-value">$0</div>
                </div>
                <div class="mini">
                  <div class="m-title">狀態</div>
                  <div id="miniState" class="m-value">待輸入</div>
                </div>
              </div>
            </div>

            <div class="block">
              <div class="title">快速比例</div>
              <div class="mini-cards" style="margin-top:0">
                <div class="mini">
                  <div class="m-title">利潤率</div>
                  <div id="margin" class="m-value">0%</div>
                </div>
                <div class="mini">
                  <div class="m-title">成本率</div>
                  <div id="costRatio" class="m-value">0%</div>
                </div>
                <div class="mini">
                  <div class="m-title">利潤金額</div>
                  <div id="miniProfit" class="m-value">$0</div>
                </div>
              </div>
            </div>
          </div>

          <div class="chart-grid">
            <div class="chart-card">
              <div class="chart-title">成本 / 利潤圓環圖</div>
              <div class="donut-wrap">
                <div class="donut-box">
                  <svg viewBox="0 0 220 220" aria-hidden="true">
                    <circle class="donut-bg" cx="110" cy="110" r="74"></circle>
                    <circle id="costCircle" class="donut-cost" cx="110" cy="110" r="74"></circle>
                    <circle id="profitCircle" class="donut-profit" cx="110" cy="110" r="74"></circle>
                  </svg>
                  <div class="donut-center">
                    <div class="small">利潤率</div>
                    <div id="donutCenterValue" class="value">0%</div>
                  </div>
                </div>

                <div class="legend">
                  <div class="legend-item">
                    <div class="swatch" style="background:var(--blue)"></div>
                    <div class="legend-text">
                      <div class="legend-name">成本</div>
                      <div id="legendCost" class="legend-value">0%</div>
                    </div>
                  </div>
                  <div class="legend-item">
                    <div class="swatch" style="background:var(--cyan)"></div>
                    <div class="legend-text">
                      <div class="legend-name">利潤</div>
                      <div id="legendProfit" class="legend-value">0%</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="chart-card">
              <div class="chart-title">金額比較長條圖</div>
              <div class="bars">
                <div class="bar-item">
                  <div class="bar-label">售價</div>
                  <div class="bar-track"><div id="barPrice" class="bar-fill fill-price"></div></div>
                  <div id="barPriceValue" class="bar-value">$0</div>
                </div>
                <div class="bar-item">
                  <div class="bar-label">成本</div>
                  <div class="bar-track"><div id="barCost" class="bar-fill fill-cost"></div></div>
                  <div id="barCostValue" class="bar-value">$0</div>
                </div>
                <div class="bar-item">
                  <div class="bar-label">利潤</div>
                  <div class="bar-track"><div id="barProfit" class="bar-fill fill-profit"></div></div>
                  <div id="barProfitValue" class="bar-value">$0</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="reverse" class="panel">
          <div class="form-grid">
            <div class="field">
              <div class="label-row">
                <label for="reverseCost">成本</label>
                <div class="hint">cost</div>
              </div>
              <div class="inputbox">
                <span class="prefix">$</span>
                <input id="reverseCost" type="number" inputmode="decimal" step="any" placeholder="例如 700">
              </div>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="targetMargin">希望利潤占售價</label>
                <div class="hint">target margin</div>
              </div>
              <div class="inputbox">
                <input id="targetMargin" type="number" inputmode="decimal" step="any" placeholder="例如 30">
                <span class="suffix">%</span>
              </div>
            </div>

            <button id="reverseBtn" class="btn" type="button">反推售價</button>
          </div>

          <div class="reverse-box">
            <div class="title">建議售價</div>
            <div id="suggestedPrice" class="reverse-price">$0</div>
            <div id="reverseDetail" class="reverse-detail">請輸入成本與目標利潤率</div>

            <div class="reverse-metrics">
              <div class="metric">
                <div class="label">預估利潤</div>
                <div id="reverseProfitValue" class="value">$0</div>
              </div>
              <div class="metric">
                <div class="label">目標利潤率</div>
                <div id="reverseMarginValue" class="value">0%</div>
              </div>
            </div>
          </div>
        </section>

        <div class="footer-actions">
          <button id="clearBtn" class="clear" type="button">清除全部資料</button>
        </div>

        <div class="note">
          利潤金額 = 售價 − 成本<br>
          利潤占售價 =（售價 − 成本）÷ 售價 × 100%<br>
          反推售價 = 成本 ÷（1 − 目標利潤率）
        </div>
      </main>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      function byId(id){ return document.getElementById(id); }
      function num(v){
        if(v === null || v === undefined || v === "") return NaN;
        return Number(String(v).replace(/,/g, ""));
      }
      function money(v){
        var sign = v < 0 ? "-$" : "$";
        return sign + Math.abs(v).toLocaleString("zh-TW", { maximumFractionDigits: 2 });
      }
      function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

      var price = byId("price");
      var cost = byId("cost");
      var profit = byId("profit");
      var margin = byId("margin");
      var costRatio = byId("costRatio");
      var status = byId("status");
      var meterBar = byId("meterBar");
      var miniPrice = byId("miniPrice");
      var miniCost = byId("miniCost");
      var miniState = byId("miniState");
      var miniProfit = byId("miniProfit");

      var costCircle = byId("costCircle");
      var profitCircle = byId("profitCircle");
      var donutCenterValue = byId("donutCenterValue");
      var legendCost = byId("legendCost");
      var legendProfit = byId("legendProfit");

      var barPrice = byId("barPrice");
      var barCost = byId("barCost");
      var barProfit = byId("barProfit");
      var barPriceValue = byId("barPriceValue");
      var barCostValue = byId("barCostValue");
      var barProfitValue = byId("barProfitValue");

      var reverseCost = byId("reverseCost");
      var targetMargin = byId("targetMargin");
      var suggestedPrice = byId("suggestedPrice");
      var reverseDetail = byId("reverseDetail");
      var reverseProfitValue = byId("reverseProfitValue");
      var reverseMarginValue = byId("reverseMarginValue");

      var reverseBtn = byId("reverseBtn");
      var clearBtn = byId("clearBtn");

      var radius = 74;
      var circumference = 2 * Math.PI * radius;

      function setCircle(circle, startRatio, ratio){
        var startOffset = circumference * (1 - startRatio);
        var dash = circumference * ratio;
        circle.style.strokeDasharray = dash + " " + circumference;
        circle.style.strokeDashoffset = startOffset;
      }

      function resetCharts(){
        profit.textContent = "$0";
        margin.textContent = "0%";
        costRatio.textContent = "0%";
        status.textContent = "請輸入售價與成本";
        status.className = "status neutral";
        meterBar.style.width = "0%";

        miniPrice.textContent = "$0";
        miniCost.textContent = "$0";
        miniProfit.textContent = "$0";
        miniState.textContent = "待輸入";

        donutCenterValue.textContent = "0%";
        legendCost.textContent = "0%";
        legendProfit.textContent = "0%";
        setCircle(costCircle, 0, 0);
        setCircle(profitCircle, 0, 0);

        barPrice.style.width = "0%";
        barCost.style.width = "0%";
        barProfit.style.width = "0%";
        barProfit.className = "bar-fill fill-profit";
        barPriceValue.textContent = "$0";
        barCostValue.textContent = "$0";
        barProfitValue.textContent = "$0";
      }

      function updateBars(p, c, pf){
        var maxValue = Math.max(Math.abs(p), Math.abs(c), Math.abs(pf), 1);
        var priceW = Math.abs(p) / maxValue * 100;
        var costW = Math.abs(c) / maxValue * 100;
        var profitW = Math.abs(pf) / maxValue * 100;

        barPrice.style.width = priceW + "%";
        barCost.style.width = costW + "%";
        barProfit.style.width = profitW + "%";
        barProfit.className = "bar-fill " + (pf >= 0 ? "fill-profit" : "fill-loss");

        barPriceValue.textContent = money(p);
        barCostValue.textContent = money(c);
        barProfitValue.textContent = money(pf);
      }

      function updateDonut(costPercent, profitPercent){
        var safeCost = clamp(costPercent, 0, 100) / 100;
        var safeProfit = clamp(profitPercent, 0, 100) / 100;

        setCircle(costCircle, 0, safeCost);
        setCircle(profitCircle, safeCost, safeProfit);

        legendCost.textContent = costPercent.toFixed(2) + "%";
        legendProfit.textContent = profitPercent.toFixed(2) + "%";
        donutCenterValue.textContent = profitPercent.toFixed(2) + "%";
      }

      function calculate(){
        var p = num(price.value);
        var c = num(cost.value);

        if(!Number.isFinite(p) || !Number.isFinite(c)){
          resetCharts();
          return;
        }

        var pf = p - c;
        var m = p !== 0 ? (pf / p) * 100 : 0;
        var cr = p !== 0 ? (c / p) * 100 : 0;

        profit.textContent = money(pf);
        margin.textContent = m.toFixed(2) + "%";
        costRatio.textContent = cr.toFixed(2) + "%";
        miniPrice.textContent = money(p);
        miniCost.textContent = money(c);
        miniProfit.textContent = money(pf);

        if(pf > 0){
          status.textContent = "每筆可賺 " + money(pf);
          status.className = "status good";
          miniState.textContent = "獲利";
        }else if(pf < 0){
          status.textContent = "每筆虧損 " + money(Math.abs(pf));
          status.className = "status bad";
          miniState.textContent = "虧損";
        }else{
          status.textContent = "目前為損益兩平";
          status.className = "status neutral";
          miniState.textContent = "打平";
        }

        meterBar.style.width = clamp(m, 0, 100) + "%";
        updateDonut(cr, Math.max(0, m));
        updateBars(p, c, pf);
      }

      function reverseCalculate(){
        var c = num(reverseCost.value);
        var m = num(targetMargin.value);

        if(!Number.isFinite(c) || !Number.isFinite(m)){
          suggestedPrice.textContent = "$0";
          reverseDetail.textContent = "請輸入成本與目標利潤率";
          reverseProfitValue.textContent = "$0";
          reverseMarginValue.textContent = "0%";
          return;
        }

        if(m >= 100){
          suggestedPrice.textContent = "無法計算";
          reverseDetail.textContent = "目標利潤率必須低於 100%";
          reverseProfitValue.textContent = "--";
          reverseMarginValue.textContent = m.toFixed(2) + "%";
          return;
        }

        var p = c / (1 - m / 100);
        var pf = p - c;

        suggestedPrice.textContent = money(p);
        reverseDetail.textContent = "若想達到此利潤率，建議售價約為 " + money(p);
        reverseProfitValue.textContent = money(pf);
        reverseMarginValue.textContent = m.toFixed(2) + "%";
      }

      ["input", "change", "keyup"].forEach(function(evt){
        price.addEventListener(evt, calculate);
        cost.addEventListener(evt, calculate);
        reverseCost.addEventListener(evt, reverseCalculate);
        targetMargin.addEventListener(evt, reverseCalculate);
      });

      reverseBtn.addEventListener("click", reverseCalculate);

      document.querySelectorAll(".tab").forEach(function(tab){
        tab.addEventListener("click", function(){
          document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
          document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
          tab.classList.add("active");
          byId(tab.getAttribute("data-panel")).classList.add("active");
        });
      });

      clearBtn.addEventListener("click", function(){
        price.value = "";
        cost.value = "";
        reverseCost.value = "";
        targetMargin.value = "";
        resetCharts();
        reverseCalculate();
        price.focus();
      });

      resetCharts();
      reverseCalculate();
    })();
  </script>
</body>
</html>
